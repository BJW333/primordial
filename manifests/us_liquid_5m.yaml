# Liquid US ETFs, 5-MINUTE base. First sub-hour universe.
#
# 1) python3.10 scripts/fetch_data.py manifests/us_liquid_5m.yaml
# 2) python3.10 -m primordial run --manifest manifests/us_liquid_5m.yaml \
#        --generations 20 --pop 40 --islands 3
#
# WHY THESE INSTRUMENTS: index_etf is the cheapest tier alive (0.5 spread +
# 0.5 slippage per side = 2bps round trip). At 5m the cost wall is what
# decides everything, so anything wider than this tier is pre-doomed.
#
# WHY THIS DATE RANGE: Alpaca intraday history, and it keeps the fingerprint
# distinct from the burned global_etfs ledger (fingerprint = symbols + dates
# + holdout geometry; overlapping tickers on a different span = fresh ledger,
# though the INSTRUMENTS are not fresh -- worth remembering when reading
# survivors).
name: us_liquid_5m
asset_class: equity
source: alpaca                 # yfinance caps intraday history at ~60 days
symbols: [SPY, QQQ, IWM, DIA, XLE, XLF, XLK, XLI, XLV, XLP,
          XLU, XLB, XLY, XLC, SMH, GLD, TLT, HYG, EEM, EFA]
base_timeframe: 5m
allowed_timeframes: [5m, 15m, 30m, 1h]
start: "2021-01-01"
end: "2026-06-01"
cost_tier: index_etf
holdout_name_frac: 0.4
holdout_time_frac: 0.3
embargo_bars: 240              # ~3 sessions at 5m, not 20 bars
engines: [timing, cross_sectional]
n_motifs: 6
motif_scales: [24, 78]         # ~2h and ~1 session in 5m bars
context_symbols: [UUP, VIXY, LQD]
