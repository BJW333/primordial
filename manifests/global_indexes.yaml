# Search all major stock market indexes -- USA, Europe, Korea, India, Japan,
# HK, and more -- on daily bars with deep multi-regime history. Long/flat
# timing (you cannot short an index composite directly; use the ETF-proxy
# manifest for long/short).
name: global_indexes
asset_class: index
source: yfinance
symbols: global_indexes          # preset -> ~21 index tickers
base_timeframe: 1d
allowed_timeframes: [1d, 1w]
start: "2005-01-01"              # covers 2008, 2020, 2022 regimes
end: "2026-06-01"
cost_tier: index_etf
holdout_name_frac: 0.4
holdout_time_frac: 0.3
embargo_bars: 20
engines: [timing]
n_motifs: 5
motif_scales: [20, 40]
