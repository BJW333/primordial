# TRUE cross-asset ground: crypto + equities + bonds + metals + commodities +
# credit + REITs. Built because every rotation strategy tested so far died at
# the BOOTSTRAP -- 20-40 equity ETFs panic on the same days, so many tickers
# collapse into one bet. These do not: BTC, TLT, GLD and XLE have genuinely
# different drivers, which is the only structural fix for that failure.
# COST CAVEAT: one tier cannot be right for both ETFs (~2bps) and crypto
# spot (~70bps). equity_liquid is a compromise -- read the 2x/3x cost-stress
# row as the honest crypto bracket.
name: cross_asset_daily
asset_class: equity
source: yfinance
symbols: [BTC-USD, ETH-USD,
          SPY, QQQ, IWM, MDY, EFA, EEM, EWJ, VGK,
          GLD, SLV, GDX, DBC, USO, PDBC,
          TLT, IEF, SHY, BND, AGG, TIP, MUB,
          LQD, HYG, EMB,
          VNQ, XLE, XLF, XLU, XLP]
base_timeframe: 1d
allowed_timeframes: [1d]
start: "2015-01-01"
end: "2026-06-01"
cost_tier: equity_liquid
holdout_name_frac: 0.4
holdout_time_frac: 0.3
embargo_bars: 50
engines: [timing]
n_motifs: 6
motif_scales: [20, 40]
context_symbols: [VIXY, TLT]
