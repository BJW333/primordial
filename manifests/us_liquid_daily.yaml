# Liquid US ETFs, DAILY, with volatility context -- built to test the
# "buy panic" claim: does an equity dip + VIX spike predict a bounce?
name: us_liquid_daily
asset_class: equity
source: yfinance
symbols: [SPY, QQQ, IWM, DIA, XLE, XLF, XLK, XLI, XLV, XLP,
          XLU, XLB, XLY, SMH, EEM, EFA, VNQ, GLD, TLT, HYG]
base_timeframe: 1d
allowed_timeframes: [1d]
start: "2010-01-01"
end: "2026-06-01"
cost_tier: index_etf
holdout_name_frac: 0.4
holdout_time_frac: 0.3
embargo_bars: 50
engines: [timing]
n_motifs: 6
motif_scales: [20, 40]
context_symbols: [VIXY, TLT]
