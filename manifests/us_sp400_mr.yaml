# MEAN-REVERSION SEARCH GROUND (2026-08-11)
# Same names/costs/split as us_sp400.yaml, with three deliberate constraints
# taken from things this project already learned the hard way:
#
#   allowed_timeframes: [1d] ONLY -- in the us_liquid_5m run evolution
#     abandoned the intended timeframe within one generation and produced
#     zero survivors. If the hypothesis is daily mean reversion, do not
#     leave a 1w escape hatch open.
#   engines: both -- absolute (timing) and relative (cross_sectional) MR are
#     different claims; let the search tell you which one it finds, and the
#     ledger charge the whole search either way.
#   embargo raised 20 -> 40 -- MR holds are multi-week; a 20-bar embargo
#     leaks a hold across the boundary.
#
# SURVIVORSHIP: today's membership. Any survivor owes a point-in-time
# re-test before capital -- same queue as the sp400 rotation.
name: us_sp400_mr
asset_class: equity
source: yfinance
symbols_file: sp400_symbols.txt
base_timeframe: 1d
allowed_timeframes: [1d]
start: "2010-01-01"
end: "2026-06-01"
cost_tier: equity_midcap
holdout_name_frac: 0.4
holdout_time_frac: 0.3
embargo_bars: 40
engines: [timing, cross_sectional]
n_motifs: 6
motif_scales: [20, 40]
context_symbols: [SPY, TLT, IWM]
